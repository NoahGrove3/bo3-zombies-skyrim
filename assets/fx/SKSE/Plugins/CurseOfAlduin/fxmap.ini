# The Curse of Alduin - the effects map (src/Gun.cpp FxMapLoad)
# (Noah: "I want the effects for all the weapons and their attacks/abilities to be compiled of Skyrim mods from nexus or base
# Skyrim stuff ... Don't make your stuff from scratch it's higher quality from the mods")
# Each line stands Skyrim's own effect models (Skyrim, Dawnguard, Dragonborn) or an installed magic mod's in for one of ours:
#   <our model> = <model> [pal=<ramp>] [col=r,g,b] [s=<size>] [r=<x>,<y>,<z> degrees] [z=<raise>] [noplay] ; <another> ...
# pal: one of our colour ramps (fire violet gold blue white red frost shock sun blood poison) laid over the model's own fire or
# light. `none` draws nothing. In game the dev command `fxreload` reads this file again.

# ---- the class swords' slashes: the shouts' own flying waves, in each blade's colour
CurseOfAlduin\fx\arc_purple.nif = magic\voiceflamewaveproject01.nif pal=violet s=0.5
CurseOfAlduin\fx\arc_carian.nif = magic\voicefrostwaveproject01.nif pal=blue s=0.5
CurseOfAlduin\fx\arc_white.nif  = magic\voiceflamewaveproject01.nif pal=white s=0.5
CurseOfAlduin\fx\arc_red.nif    = magic\voiceflamewaveproject01.nif pal=red s=0.5
CurseOfAlduin\fx\arc_fire.nif   = magic\voiceflamewaveproject01.nif s=0.5
CurseOfAlduin\fx\arc_frost.nif  = magic\voicefrostwaveproject01.nif s=0.5
CurseOfAlduin\fx\arc_shock.nif  = magic\voicefrostwaveproject01.nif pal=shock s=0.5
CurseOfAlduin\fx\arc_sun.nif    = magic\voiceflamewaveproject01.nif pal=sun s=0.5
CurseOfAlduin\fx\arc_blood.nif  = magic\voiceflamewaveproject01.nif pal=blood s=0.5
CurseOfAlduin\fx\arc_gold.nif   = magic\voiceflamewaveproject01.nif pal=gold s=0.5
CurseOfAlduin\fx\arc_bane.nif   = magic\voiceflamewaveproject01.nif s=0.5

# ---- the heavy attacks
# Shadowflame: the Cyclone shout's whirlwind (Dragonborn) around the College's magic fire pillar, both violet
CurseOfAlduin\fx\firecyclone.nif = dlc02\effects\dlc2cycloneshoutprojectile.nif pal=violet s=6 ; effects\mgmagicfirepillar01.nif pal=violet s=6
# Summoner: Auriel's sunbeam from the sky (Dawnguard) and its sunburst on the ground
CurseOfAlduin\fx\sunpillar.nif = dlc01\magic\dlc1aurielsunbeam01.nif s=1 ; dlc01\magic\dlc1sunburstfx01.nif s=1
# Destruction: Apocalypse's Electrosphere as the dome
CurseOfAlduin\fx\ldome.nif = apocnew\destructionshock_projectile_electrosphere.nif s=0.4

# ---- meteors: Apocalypse's meteor (the Bane's in its own fire, the Slayer's gold)
CurseOfAlduin\fx\meteor_fire.nif = apocnew\destructionfire_projectile_meteor.nif s=1
CurseOfAlduin\fx\meteor_gold.nif = apocnew\destructionfire_projectile_meteor.nif pal=gold s=1
