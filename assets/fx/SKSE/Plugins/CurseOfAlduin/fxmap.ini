# The Curse of Alduin - the effects map (src/Gun.cpp FxMapLoad)
# (Noah: "I want the effects for all the weapons and their attacks/abilities to be compiled of Skyrim mods from nexus or base
# Skyrim stuff ... Don't make your stuff from scratch it's higher quality from the mods")
# Each line stands Skyrim's own effect models (Skyrim, Dawnguard, Dragonborn) or an installed magic mod's in for one of ours:
#   <our model> = <model> [pal=<ramp>] [col=r,g,b] [s=<size>] [r=<x>,<y>,<z> degrees] [z=<raise>] [noplay] ; <another> ...
# pal: one of our colour ramps (fire violet gold blue white red frost shock sun blood poison) laid over the model's own fire or
# light. `none` draws nothing. In game the dev command `fxreload` reads this file again.

# ---- the class swords' light attacks (Noah: "Compact magic projectiles"): Skyrim's own bolts, in each class's element; the
# Dragon Slayer's and Alduin's Bane's: the shouts' own flying waves
CurseOfAlduin\fx\arc_purple.nif = magic\fireboltprojectile.nif pal=violet s=1.1
CurseOfAlduin\fx\arc_carian.nif = magic\fireboltprojectile.nif pal=blue s=1.1
CurseOfAlduin\fx\arc_white.nif  = dlc01\magic\dlc1sunlightprojectile.nif pal=white s=1.4   # (Noah, clip 10: the Radiant Blade's light attack "should shoot a sun ball projectile painted white")
CurseOfAlduin\fx\arc_red.nif    = magic\fireboltprojectile.nif s=1.1
CurseOfAlduin\fx\arc_fire.nif   = magic\fireboltprojectile.nif s=1.1
CurseOfAlduin\fx\arc_frost.nif  = magic\iceprojectile01.nif s=1.1
CurseOfAlduin\fx\arc_shock.nif  = magic\fireboltprojectile.nif pal=shock s=1.1
CurseOfAlduin\fx\arc_sun.nif    = dlc01\magic\dlc1sunlightprojectile.nif s=1.1
CurseOfAlduin\fx\arc_blood.nif  = apocnew\restorationarcane_projectile.nif s=2 play   # (Blood made Arcane: the Spellbound Blade's arcane bolts - Noah's \"BOLT A\")
CurseOfAlduin\fx\star_ball.nif = dlc01\magic\dlc1sunlightprojectile.nif pal=gold s=0.65   # (Noah: the Wandering Star "should shoot a small golden ball" that bounces from one of the dead to the next)
CurseOfAlduin\fx\arc_gold.nif   = magic\fireballprojectile01.nif pal=gold s=1.3   # (Noah: "a fireball that is golden flames")
CurseOfAlduin\fx\arc_bane.nif   = magic\voicepushprojectile01.nif s=1.4 play   # (Noah: "Unrelenting Force waves")

# ---- the heavy attacks
# Shadowflame: the Cyclone shout's whirlwind (Dragonborn) around the College's magic fire pillar, both violet
CurseOfAlduin\fx\firecyclone.nif = dlc02\effects\dlc2cycloneshoutprojectile.nif noparticles pal=violet s=3 play ; effects\mgmagicfirepillar01.nif pal=violet s=1
# Summoner: Auriel's sunbeam from the sky (Dawnguard) and its sunburst on the ground
CurseOfAlduin\fx\sunpillar.nif = dlc01\magic\dlc1aurielsunbeam01.nif s=1 ; dlc01\magic\dlc1sunburstfx01.nif s=1
# Destruction: Apocalypse's Electrosphere as the dome
CurseOfAlduin\fx\ldome.nif = apocnew\destructionshock_projectile_electrosphere.nif s=0.4

# ---- meteors (Noah: "the smaller fireballs instead of the large rocks"): Skyrim's own fireball
CurseOfAlduin\fx\meteor_fire.nif = magic\fireballprojectile01.nif s=1.6
CurseOfAlduin\fx\meteor_gold.nif = magic\fireballprojectile01.nif pal=gold s=1.6

# ---- the bursts every weapon's hits set off (src/Gun.cpp ElemBurst) (Noah: "Their own element's spell impact"; flasks "way too
# big"; "those golden explosions ... should only be for the Dragon Slayer"): Skyrim's own spell impacts - small by make (a whole
# explosion's flames keep their size however it's scaled)
CurseOfAlduin\fx\burst_fire.nif       = effects\impacteffects\fxdragonfireimpactactor.nif s=0.8
CurseOfAlduin\fx\burst_frost.nif      = effects\impacteffects\impactfrostsmall01.nif s=1
CurseOfAlduin\fx\burst_shock.nif      = apocnew\destructionshock_explosion_discharge.nif s=1   # (Noah picked E: Apocalypse Discharge)
CurseOfAlduin\fx\burst_wind.nif       = magic\shoutareaexplosionsmall01.nif s=0.6
CurseOfAlduin\fx\burst_sun.nif        = dlc01\magic\dlc1impactsunfirespell.nif s=1
CurseOfAlduin\fx\burst_blood.nif     = apocnew\illusionblue_explosion.nif s=0.6   # (blood made Arcane, blue-white: the Voidglass Flask's burst)
CurseOfAlduin\fx\burst_crimson.nif   = apocnew\illusionblue_explosion.nif pal=blood s=0.6   # (Noah: the Bloodmoon Scythe's and the Talons of Woe's impacts "blue ... should be red" - blood's own burst, red)
CurseOfAlduin\fx\burst_void.nif       = magic\absorbredimpact01.nif s=1
CurseOfAlduin\fx\burst_poison.nif     = magus\mysticism\poisonexplosion01.nif s=1   # (Noah picked B: Mysticism poison explosion 1)
CurseOfAlduin\fx\burst_gold.nif       = apocnew\destructionwizardfire_explosion.nif pal=gold s=1   # (Noah: no lingering gold smoke) (the Dragon Slayer's alone)
CurseOfAlduin\fx\burst_holy.nif       = dlc01\magic\dlc1impactsunfirespell.nif pal=gold s=1.2   # (Holy Water: golden)
CurseOfAlduin\fx\burst_shadowfire.nif = apocnew\destructionwizardfire_explosion.nif pal=violet s=1   # (Noah picked D: no lingering smoke)
CurseOfAlduin\fx\purplefire.nif       = apocnew\destructionwizardfire_explosion.nif pal=violet s=1   # (no lingering smoke, as burst_shadowfire)

# ---- the heavy attacks' shockwave rings: the Labyrinthian's shockwave, in each colour
CurseOfAlduin\fx\ring_fire.nif   = effects\mg07labyrinthianshockwave.nif pal=fire s=0.4
CurseOfAlduin\fx\ring_purple.nif = effects\mg07labyrinthianshockwave.nif pal=violet s=0.4
CurseOfAlduin\fx\ring_white.nif  = effects\mg07labyrinthianshockwave.nif pal=white s=0.4
CurseOfAlduin\fx\ring_blue.nif   = effects\mg07labyrinthianshockwave.nif pal=shock s=0.4
CurseOfAlduin\fx\ring_gold.nif   = effects\mg07labyrinthianshockwave.nif pal=gold s=0.4
CurseOfAlduin\fx\ring_frost.nif  = effects\mg07labyrinthianshockwave.nif pal=frost s=0.4
CurseOfAlduin\fx\ring_shock.nif  = effects\mg07labyrinthianshockwave.nif pal=shock s=0.4
CurseOfAlduin\fx\ring_sun.nif    = effects\mg07labyrinthianshockwave.nif pal=sun s=0.4
CurseOfAlduin\fx\ring_blood.nif  = effects\mg07labyrinthianshockwave.nif pal=blood s=0.4

# ---- the Spellsword's shockwave line: Ice Spike volley's shards - (Noah) the blood line's tinted blood red
CurseOfAlduin\fx\spike_frost.nif = magic\magicespikevolleyexplosion.nif s=0.6
CurseOfAlduin\fx\spike_blood.nif = magic\magicespikevolleyexplosion.nif pal=blood s=0.6

# ---- the spectral blades: Skyrim's own bound sword (its conjured blade of light), not the steel ones
# Destruction Tier III: the Carian Greatblade, giant, swept flat before you
CurseOfAlduin\fx\greatblade.nif = weapons\boundweapons\boundswordencheffects.nif pal=blue s=1.4
# Summoner Tier III: three blades of white light circling you
CurseOfAlduin\fx\haloblade.nif = weapons\boundweapons\boundswordencheffects.nif pal=white s=1.6

# ---- the heavy attacks' cyclones (src/Classes.cpp ClassCyclone: Tier II small, Tier III large) (Noah: "hyper realistic ... in the
# element that is being casted"): Skyrim's Cyclone shout's own smoky storm funnel, shaded in the element (a colour laid over
# its own - a ramp turned it pink), and the ground it passes over left burning in that element - Skyrim's real fire, frost,
# light (<cyclone>_trail.nif: set down every third of a second)
CurseOfAlduin\fx\cyclone_violet.nif = apocnew\destructionfrost_hazard_tornado2.nif pal=violet s=0.45 play ; effects\mgmagicfirepillar01.nif pal=violet s=0.6 play   # (Noah picked A: violet tornado + pillar of fire)
CurseOfAlduin\fx\cyclone_violet_trail.nif = apocnew\destructionwizardfire_explosion.nif pal=violet s=0.6   # (seen in game: the oil fire's flames stay orange whatever their tint - the violet dragonfire the light hits burst in)
CurseOfAlduin\fx\cyclone_white.nif = apocnew\destructionfrost_hazard_tornado2.nif col=1,0.85,0.5 s=0.45 play
CurseOfAlduin\fx\cyclone_white_trail.nif = magic\lightspellhazard.nif pal=gold s=0.6
CurseOfAlduin\fx\cyclone_bane.nif = apocnew\destructionfrost_hazard_tornado2.nif col=1.5,1.5,1.5 s=0.6 play ; effects\mgmagicfirepillar01.nif col=1.5,1.5,1.5 s=0.5 play   # (Noah, 2026-11-11: the Rimewick's blizzard and Alduin's Bane's heavy "look strange and only visible at some angles" - the Cyclone shout's flat wind cards, unparticled: now Apocalypse's tornado, seen from every side)
CurseOfAlduin\fx\cyclone_gold.nif = apocnew\destructionfrost_hazard_tornado2.nif pal=gold s=0.45 play
CurseOfAlduin\fx\cyclone_gold_trail.nif = apocnew\destructionwizardfire_explosion.nif pal=gold s=0.6
CurseOfAlduin\fx\cyclone_fire.nif   = apocnew\destructionfrost_hazard_tornado2.nif pal=fire s=0.45 play ; effects\mgmagicfirepillar01.nif pal=fire s=0.6 play   # (Noah: "the spellsword class doesn't have the fire tornado" - the Cyclone shout's untinted wind showed nothing: the violet one's tornado and pillar, in fire)
CurseOfAlduin\fx\cyclone_fire_trail.nif = effects\impacteffects\fxdragonfireimpactactor.nif s=0.5   # (seen in game: the oil fire burns pale lilac - Skyrim's dragonfire, orange)
CurseOfAlduin\fx\cyclone_frost.nif = apocnew\destructionfrost_hazard_tornado2.nif s=0.5 play ; magic\icehazard01.nif s=0.7   # (Noah, 2026-11-11: the Rimewick's blizzard and Alduin's Bane's heavy "look strange and only visible at some angles" - the Cyclone shout's flat wind cards, unparticled: now Apocalypse's tornado, seen from every side)
CurseOfAlduin\fx\cyclone_frost_trail.nif = magic\icehazard01.nif s=0.5
CurseOfAlduin\fx\cyclone_shock.nif = apocnew\destructionfrost_hazard_tornado2.nif pal=shock s=0.45 play ; apocnew\destructionshock_hazard_lightningstrike.nif s=0.8 play
CurseOfAlduin\fx\cyclone_shock_trail.nif = magic\icehazard01.nif pal=shock s=0.4
CurseOfAlduin\fx\cyclone_blood.nif = apocnew\destructionfrost_hazard_tornado2.nif col=0.7,0.8,1 s=0.45 play
CurseOfAlduin\fx\cyclone_blood_trail.nif = apocnew\illusionblue_explosion.nif s=0.35
# Destruction (Noah: "all the elements in one tornado, fire, ice, lightning"): the storm funnel in lightning-blue, leaving fire
# and frost both behind it
CurseOfAlduin\fx\cyclone_storm.nif  = apocnew\destructionfrost_hazard_tornado2.nif pal=frost s=0.45 play ; effects\mgmagicfirepillar01.nif pal=fire s=0.6 play ; effects\mgmagicfirepillar01.nif pal=frost s=0.45 play ; effects\mgmagicfirepillar01.nif pal=shock s=0.35 play ; apocnew\destructionshock_hazard_lightningstrike.nif s=1 play   # (Noah: "A. but I want the pillar of fire to contain ice and lightning elements in one pillar going up a blue tornado": Apocalypse's tornado in blue, one pillar of fire, frost and lightning in its core, Apocalypse's lightning striking)
CurseOfAlduin\fx\cyclone_storm_trail.nif = effects\impacteffects\fxdragonfireimpactactor.nif s=0.45 ; magic\icehazard01.nif s=0.45 ; magic\impactshock01.nif s=1
# Alduin's Bane's wind vortex: the whirlwind as Skyrim made it
CurseOfAlduin\fx\cyclone_wind.nif = apocnew\destructionfrost_hazard_tornado2.nif col=0.9,0.9,0.9 s=0.5 play
CurseOfAlduin\fx\cyclone_poison.nif = apocnew\destructionfrost_hazard_tornado2.nif pal=poison s=0.45 play
