# the Philosopher's Flask (Noah: "Gold sun burst + cloud"): Skyrim's light blast and fireball in gold, then its poison cloud in
# molten gold billowing again every 2.5 s its whole life (a sunburst or a cloud set down as a hazard stood unseen)
CurseOfAlduin\fx\philosopher_burst.nif = blast:lightmassive pal=gold s=0.35 ; blast:fireball pal=gold s=0.6
CurseOfAlduin\fx\philosopher_cloud.nif = blast:poisongas pal=gold s=1.0

# ---- the Dragon Slayer's light swings (Noah: "Dragonfire breath puffs"): Skyrim's Fire Breath, its real fire
CurseOfAlduin\fx\slayer_breath.nif = magic\magfirebreathshout.nif s=1 play
# ---- Alduin's Bane's heavy swing (Noah: "Dragon shout blast"): Unrelenting Force at its fullest
CurseOfAlduin\fx\bane_shout.nif = magic\voicepushprojectile03.nif s=2.5 play
