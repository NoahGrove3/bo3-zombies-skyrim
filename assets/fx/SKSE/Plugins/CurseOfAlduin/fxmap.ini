# The Curse of Alduin - the effects map (src/Gun.cpp FxMapLoad)
# (Noah: "I want the effects for all the weapons and their attacks/abilities to be compiled of Skyrim mods from nexus or base
# Skyrim stuff ... Don't make your stuff from scratch it's higher quality from the mods")
# Each line stands Skyrim's own effect models (Skyrim, Dawnguard, Dragonborn) or an installed magic mod's in for one of ours:
#   <our model> = <model> [pal=<ramp>] [col=r,g,b] [s=<size>] [r=<x>,<y>,<z> degrees] [z=<raise>] [noplay] ; <another> ...
# pal: one of our colour ramps (fire violet gold blue white red frost shock sun blood poison) laid over the model's own fire or
# light. `none` draws nothing. In game the dev command `fxreload` reads this file again.

# ---- the class swords' light attacks (Noah: "Compact magic projectiles"): Skyrim's own bolts, in each class's element; the
# Dragon Slayer's and Alduin's Bane's: the shouts' own flying waves
CurseOfAlduin\fx\arc_purple.nif = magic\fireboltprojectile.nif pal=violet s=1.1
CurseOfAlduin\fx\arc_carian.nif = magic\fireboltprojectile.nif pal=blue s=1.1
CurseOfAlduin\fx\arc_white.nif  = dlc01\magic\dlc1sunlightprojectile.nif pal=white s=1.1
CurseOfAlduin\fx\arc_red.nif    = magic\fireboltprojectile.nif s=1.1
CurseOfAlduin\fx\arc_fire.nif   = magic\fireboltprojectile.nif s=1.1
CurseOfAlduin\fx\arc_frost.nif  = magic\iceprojectile01.nif s=1.1
CurseOfAlduin\fx\arc_shock.nif  = magic\fireboltprojectile.nif pal=shock s=1.1
CurseOfAlduin\fx\arc_sun.nif    = dlc01\magic\dlc1sunlightprojectile.nif s=1.1
CurseOfAlduin\fx\arc_blood.nif  = magic\fireboltprojectile.nif pal=blood s=1.1
CurseOfAlduin\fx\arc_gold.nif   = magic\voiceflamewaveproject01.nif pal=gold s=3.5 play
CurseOfAlduin\fx\arc_bane.nif   = magic\voiceflamewaveproject01.nif s=3.5 play

# ---- the heavy attacks
# Shadowflame: the Cyclone shout's whirlwind (Dragonborn) around the College's magic fire pillar, both violet
CurseOfAlduin\fx\firecyclone.nif = dlc02\effects\dlc2cycloneshoutprojectile.nif pal=violet s=3 play ; effects\mgmagicfirepillar01.nif pal=violet s=1
# Summoner: Auriel's sunbeam from the sky (Dawnguard) and its sunburst on the ground
CurseOfAlduin\fx\sunpillar.nif = dlc01\magic\dlc1aurielsunbeam01.nif s=1 ; dlc01\magic\dlc1sunburstfx01.nif s=1
# Destruction: Apocalypse's Electrosphere as the dome
CurseOfAlduin\fx\ldome.nif = apocnew\destructionshock_projectile_electrosphere.nif s=0.4

# ---- meteors (Noah: "the smaller fireballs instead of the large rocks"): Skyrim's own fireball
CurseOfAlduin\fx\meteor_fire.nif = magic\fireballprojectile01.nif s=1.6
CurseOfAlduin\fx\meteor_gold.nif = magic\fireballprojectile01.nif pal=gold s=1.6

# ---- the bursts every weapon sets off (src/Gun.cpp ElemBurst): Skyrim's own explosions, whole - their look, light and sound
CurseOfAlduin\fx\burst_fire.nif       = blast:fireball s=0.7
CurseOfAlduin\fx\burst_frost.nif      = blast:frost s=0.8
CurseOfAlduin\fx\burst_shock.nif      = blast:shockmass s=0.6
CurseOfAlduin\fx\burst_wind.nif       = blast:shoutarea s=0.5
CurseOfAlduin\fx\burst_sun.nif        = blast:light s=0.8
CurseOfAlduin\fx\burst_blood.nif      = blast:bloodplague s=0.7
CurseOfAlduin\fx\burst_void.nif       = blast:dark s=0.7
CurseOfAlduin\fx\burst_poison.nif     = blast:poisongas s=0.6
CurseOfAlduin\fx\burst_gold.nif       = blast:fireball pal=gold s=0.5   # (Noah: the Slayer\'s blasts "fill my screen ... much smaller")
CurseOfAlduin\fx\burst_shadowfire.nif = blast:fireball pal=violet s=0.7
CurseOfAlduin\fx\purplefire.nif       = blast:fireball pal=violet s=0.6

# ---- the heavy attacks' shockwave rings: the Labyrinthian's shockwave, in each colour
CurseOfAlduin\fx\ring_fire.nif   = effects\mg07labyrinthianshockwave.nif pal=fire s=0.4
CurseOfAlduin\fx\ring_purple.nif = effects\mg07labyrinthianshockwave.nif pal=violet s=0.4
CurseOfAlduin\fx\ring_white.nif  = effects\mg07labyrinthianshockwave.nif pal=white s=0.4
CurseOfAlduin\fx\ring_blue.nif   = effects\mg07labyrinthianshockwave.nif pal=shock s=0.4
CurseOfAlduin\fx\ring_gold.nif   = effects\mg07labyrinthianshockwave.nif pal=gold s=0.4
CurseOfAlduin\fx\ring_frost.nif  = effects\mg07labyrinthianshockwave.nif pal=frost s=0.4
CurseOfAlduin\fx\ring_shock.nif  = effects\mg07labyrinthianshockwave.nif pal=shock s=0.4
CurseOfAlduin\fx\ring_sun.nif    = effects\mg07labyrinthianshockwave.nif pal=sun s=0.4
CurseOfAlduin\fx\ring_blood.nif  = effects\mg07labyrinthianshockwave.nif pal=blood s=0.4

# ---- the Spellsword's shockwave line: Ice Spike volley's shards - (Noah) the blood line's tinted blood red
CurseOfAlduin\fx\spike_frost.nif = magic\magicespikevolleyexplosion.nif s=0.6
CurseOfAlduin\fx\spike_blood.nif = magic\magicespikevolleyexplosion.nif pal=blood s=0.6

# ---- the spectral blades: Skyrim's own bound sword (its conjured blade of light), not the steel ones
# Destruction Tier III: the Carian Greatblade, giant, swept flat before you
CurseOfAlduin\fx\greatblade.nif = weapons\boundweapons\boundswordencheffects.nif pal=blue s=1.4
# Summoner Tier III: three blades of white light circling you
CurseOfAlduin\fx\haloblade.nif = weapons\boundweapons\boundswordencheffects.nif pal=white s=1.6

# ---- the heavy attacks' cyclones (src/Classes.cpp ClassCyclone: Tier II small, Tier III large): Skyrim's Cyclone shout's
# whirlwind (Dragonborn) round the College's magic fire pillar, in each class's element
CurseOfAlduin\fx\cyclone_violet.nif = dlc02\effects\dlc2cycloneshoutprojectile.nif pal=violet s=3 play ; effects\mgmagicfirepillar01.nif pal=violet s=1
CurseOfAlduin\fx\cyclone_white.nif  = dlc02\effects\dlc2cycloneshoutprojectile.nif pal=white s=3 play ; effects\mgmagicfirepillar01.nif pal=white s=1
CurseOfAlduin\fx\cyclone_gold.nif   = dlc02\effects\dlc2cycloneshoutprojectile.nif pal=gold s=3 play ; effects\mgmagicfirepillar01.nif pal=gold s=1
CurseOfAlduin\fx\cyclone_fire.nif   = dlc02\effects\dlc2cycloneshoutprojectile.nif pal=fire s=3 play ; effects\mgmagicfirepillar01.nif s=1
CurseOfAlduin\fx\cyclone_frost.nif  = dlc02\effects\dlc2cycloneshoutprojectile.nif pal=frost s=3 play ; magic\impactfrosticestorm.nif s=1
CurseOfAlduin\fx\cyclone_shock.nif  = dlc02\effects\dlc2cycloneshoutprojectile.nif pal=shock s=3 play ; magic\stormhazard.nif s=0.6
CurseOfAlduin\fx\cyclone_blood.nif  = dlc02\effects\dlc2cycloneshoutprojectile.nif pal=blood s=3 play ; effects\mgmagicfirepillar01.nif pal=blood s=1
# Destruction (Noah: "all the elements in one tornado, fire, ice, lightning"): the whirlwind in frost, the College's fire pillar
# in its own fire and blue, and lightning crackling through it
CurseOfAlduin\fx\cyclone_storm.nif  = dlc02\effects\dlc2cycloneshoutprojectile.nif pal=frost s=3 play ; effects\mgmagicfirepillar01.nif s=1 ; magic\stormhazard.nif s=0.6
# Alduin's Bane's wind vortex: the whirlwind as Skyrim made it
CurseOfAlduin\fx\cyclone_wind.nif   = dlc02\effects\dlc2cycloneshoutprojectile.nif s=3.5 play
CurseOfAlduin\fx\cyclone_poison.nif = dlc02\effects\dlc2cycloneshoutprojectile.nif pal=poison s=3 play ; effects\mgmagicfirepillar01.nif pal=poison s=1

# ---- the Alchemist's flasks (Noah: "none that you fabricated"): every look Skyrim's own
# in flight (Noah: "Keep arc, add a trail"): the flask itself and its element streaming behind it - Skyrim's own bolts, small
CurseOfAlduin\alchemist\flask_fire.nif   = CurseOfAlduin\alchemist\flask_fire.nif ; magic\fireboltprojectile.nif s=0.35
CurseOfAlduin\alchemist\flask_frost.nif  = CurseOfAlduin\alchemist\flask_frost.nif ; magic\iceprojectile01.nif s=0.35
CurseOfAlduin\alchemist\flask_shock.nif  = CurseOfAlduin\alchemist\flask_shock.nif ; magic\fireboltprojectile.nif pal=shock s=0.35
CurseOfAlduin\alchemist\flask_poison.nif = CurseOfAlduin\alchemist\flask_poison.nif ; magic\fireboltprojectile.nif pal=poison s=0.35
CurseOfAlduin\alchemist\flask_sun.nif    = CurseOfAlduin\alchemist\flask_sun.nif ; dlc01\magic\dlc1sunlightprojectile.nif s=0.35
CurseOfAlduin\alchemist\flask_blood.nif  = CurseOfAlduin\alchemist\flask_blood.nif ; magic\fireboltprojectile.nif pal=blood s=0.35
CurseOfAlduin\alchemist\flask_philosopher.nif = CurseOfAlduin\alchemist\flask_philosopher.nif ; dlc01\magic\dlc1sunlightprojectile.nif pal=gold s=0.4
# where it breaks: the glass shattering (Skyrim's oil lamp breaking), then the element's spell blast (Skyrim's explosions)
CurseOfAlduin\fx\flask_glass.nif = effects\trapoillampexplosion.nif s=1
# the pool it leaves (src/Gun.cpp Puddle): Skyrim's own hazards
CurseOfAlduin\fx\ground_fire.nif   = effects\fxfireoilhazard.nif s=0.25
CurseOfAlduin\fx\ground_frost.nif  = magic\icehazard01.nif s=0.6
CurseOfAlduin\fx\ground_shock.nif  = magic\stormhazard.nif s=0.5
CurseOfAlduin\fx\ground_poison.nif = dlc02\effects\poisongasexplosion.nif s=0.6
CurseOfAlduin\fx\ground_sun.nif    = magic\lightspellhazard.nif s=0.8
CurseOfAlduin\fx\ground_blood.nif  = magic\icehazard01.nif pal=blood s=0.6
# the motes we drew rising off them: gone (the hazards carry their own)
CurseOfAlduin\fx\motes_fire.nif       = none
CurseOfAlduin\fx\motes_frost.nif      = none
CurseOfAlduin\fx\motes_shock.nif      = none
CurseOfAlduin\fx\motes_wind.nif       = none
CurseOfAlduin\fx\motes_sun.nif        = none
CurseOfAlduin\fx\motes_blood.nif      = none
CurseOfAlduin\fx\motes_void.nif       = none
CurseOfAlduin\fx\motes_poison.nif     = none
CurseOfAlduin\fx\motes_gold.nif       = none
CurseOfAlduin\fx\motes_shadowfire.nif = none
# the Philosopher's Flask (Noah: "Gold sun burst + cloud"): Dawnguard's sunburst in gold, then Skyrim's poison cloud in molten gold
CurseOfAlduin\fx\philosopher_burst.nif = dlc01\magic\dlc1sunburstfx01.nif pal=gold s=0.25
CurseOfAlduin\fx\philosopher_cloud.nif = dlc02\effects\poisongasexplosion.nif pal=gold s=1.2
