name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Sheets preflight and code generation
        run: |
          python tools/preflight.py
          python tools/gen.py
          git diff --exit-code src/Generated.h
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: vcpkg binary cache folder
        run: New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Package
        run: |
          $v = "0.1.0"
          $stage = "dist\stage"
          New-Item -ItemType Directory -Force "$stage\Data\SKSE\Plugins" | Out-Null
          Copy-Item build\BO3Zombies.dll "$stage\BO3Zombies.asi"
          Copy-Item third_party\address-library\versionlib-1-7-104-0.bin "$stage\Data\SKSE\Plugins\"
          Copy-Item README.md "$stage\BO3Zombies-README.md"
          Copy-Item third_party\address-library\CREDITS.md "$stage\BO3Zombies-ADDRESS-LIBRARY-CREDITS.md"
          python tools/zipdir.py "$stage" "dist\BO3Zombies-$v.zip"
          python tools/zipdir.py build "dist\BO3Zombies-$v-pdb.zip" --only BO3Zombies.pdb
      - uses: actions/upload-artifact@v4
        with:
          name: BO3Zombies
          path: dist\*.zip
      - name: Test release for this commit (private repo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-$($env:GITHUB_SHA.Substring(0,7))"
          gh release create $tag dist\*.zip --prerelease --title "Test build $tag" --notes "Automatic test build of $env:GITHUB_SHA" --target $env:GITHUB_SHA
      - name: Publish test build (private prerelease "ci-latest")
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-latest --yes --cleanup-tag 2>$null
          gh release create ci-latest dist\*.zip --prerelease --title "Test build ${{ github.sha }}" --notes "Untested CI build of ${{ github.sha }}" --target ${{ github.sha }}
