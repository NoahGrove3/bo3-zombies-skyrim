name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Sheets preflight and code generation
        run: |
          python tools/preflight.py
          python tools/gen.py
          python tools/gen_esp.py
          git diff --exit-code src/Generated.h data/BO3Zombies.esp
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: vcpkg binary cache folder
        run: New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-
      - name: Pin library timestamps (so the cached CommonLib build is reused)
        run: |
          $old = Get-Date '2020-01-01'
          Get-ChildItem extern -Recurse -File | ForEach-Object { $_.LastWriteTime = $old }
      - uses: actions/cache@v4
        with:
          path: build
          key: build-${{ hashFiles('.gitmodules', 'vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json') }}-${{ github.sha }}
          restore-keys: build-${{ hashFiles('.gitmodules', 'vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json') }}-
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: |
          cmake --build --preset release *> build.log
          $code = $LASTEXITCODE
          Get-Content build.log -Tail 30
          if ($code -ne 0) {
            Select-String -Path build.log -Pattern ' error |error C|error LNK|fatal error' | Select-Object -First 40 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            exit $code
          }
      - name: Package
        run: |
          $v = "0.2.0"
          $stage = "dist\stage"
          New-Item -ItemType Directory -Force "$stage\Data\SKSE\Plugins" | Out-Null
          Copy-Item build\UndyingNights.dll "$stage\UndyingNights.asi"
          New-Item -ItemType Directory -Force -Path "$stage\Data\SKSE\Plugins" | Out-Null
          Copy-Item build\UndyingNights.dll "$stage\Data\SKSE\Plugins\UndyingNights.dll"  # Skyrim Together runs the game from its own folder (no ASI loader there): SKSE loads this copy
          Copy-Item data\BO3Zombies.esp "$stage\Data\BO3Zombies.esp"
          Copy-Item third_party\address-library\versionlib-1-7-104-0.bin "$stage\Data\SKSE\Plugins\"
          python -m pip install --quiet numpy scipy pillow
          python tools/icons.py "$stage\Data\Interface\UndyingNights"
          python tools/bookart.py "$stage\Data"
          python tools/mcm.py "$stage\Data"   # the Mod Configuration page (SkyUI + MCM Helper) and the Experience file
          New-Item -ItemType Directory -Force "$stage\Data\Sound\fx\UndyingNights\un", "$stage\Data\Music\UndyingNights" | Out-Null
          Copy-Item assets\sound\un\*.wav "$stage\Data\Sound\fx\UndyingNights\un\"   # the Undying Nights SFX library, cut by tools/sfx.py
          Copy-Item assets\music\*.wav "$stage\Data\Music\UndyingNights\"
          Copy-Item assets\ui\*.png, assets\ui\*.jpg "$stage\Data\Interface\UndyingNights\"
          Copy-Item assets\fx\* "$stage\Data\" -Recurse -Force   # the ten spells' looks (tools/spellfx.py)
          New-Item -ItemType Directory -Force "$stage\Data\Interface\UndyingNights\legend" | Out-Null
          Copy-Item assets\ui\legend\* "$stage\Data\Interface\UndyingNights\legend\"   # the intro film's woodcut pages (tools/legend.py)
          New-Item -ItemType Directory -Force "$stage\Data\Interface\UndyingNights\fonts" | Out-Null
          Copy-Item assets\fonts\* "$stage\Data\Interface\UndyingNights\fonts\"
          New-Item -ItemType Directory -Force "$stage\Data\Meshes\Interface\Logo" | Out-Null
          Copy-Item assets\meshes\logo_empty.nif "$stage\Data\Meshes\Interface\Logo\logo.nif"
          Copy-Item assets\meshes\logo_empty.nif "$stage\Data\Meshes\Interface\Logo\logo01ae.nif"
          Copy-Item README.md "$stage\UndyingNights-README.md"
          Copy-Item third_party\address-library\CREDITS.md "$stage\UndyingNights-ADDRESS-LIBRARY-CREDITS.md"
          python tools/zipdir.py "$stage" "dist\UndyingNights-$v.zip"
          python tools/zipdir.py build "dist\UndyingNights-$v-pdb.zip" --only UndyingNights.pdb
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # (the release below is what we install; artifacts only add to the storage quota)
        with:
          name: UndyingNights
          path: dist\*.zip
          retention-days: 1
      - name: Test release for this commit (private repo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-$($env:GITHUB_SHA.Substring(0,7))"
          gh release create $tag dist\*.zip --prerelease --title "Test build $tag" --notes "Automatic test build of $env:GITHUB_SHA" --target $env:GITHUB_SHA
